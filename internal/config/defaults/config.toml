# Truestamp CLI Configuration
#
# Location:
#   macOS/Linux: ~/.config/truestamp/config.toml
#   Windows:     %APPDATA%\truestamp\config.toml
#
# Override order (highest priority last):
#   1. This config file
#   2. Environment variables (TRUESTAMP_ prefix)
#   3. Command-line flags

# Origin of the Truestamp service (scheme + host, no path).
# All other Truestamp URLs are derived from this value.
# Env: TRUESTAMP_BASE_URL
base_url = "https://www.truestamp.com"

# API key for authenticating with the Truestamp API
# Env: TRUESTAMP_API_KEY
api_key = ""

# Team ID for multi-tenant API operations (defaults to personal team if empty)
# Env: TRUESTAMP_TEAM
team = ""

# HTTP timeout for external API calls (Go duration: "10s", "30s", "1m")
# Env: TRUESTAMP_HTTP_TIMEOUT
http_timeout = "10s"

# Absolute path to the cosign binary used by `truestamp upgrade` for
# release-artifact signature verification. Empty (default) means "use
# $PATH lookup"; set this to pin cosign to a known install in hardened
# environments and avoid $PATH hijacking. Must be absolute if set.
# Env: TRUESTAMP_COSIGN_PATH
cosign_path = ""

# No output, exit code only. CLI-wide, not verify-specific.
# Mutually exclusive with json.
# Env: TRUESTAMP_SILENT
silent = false

# Output results as JSON. CLI-wide, not verify-specific.
# Mutually exclusive with silent.
# Env: TRUESTAMP_JSON
json = false

[verify]
# Run with no network access: chain, source and keyring reads are not made,
# and each row they would confirm is reported as skipped, never failed
# Env: TRUESTAMP_VERIFY_OFFLINE
offline = false

# Also ask the Truestamp service to verify the proof (requires
# authentication: `truestamp auth login`, or an API key). Its verdict is
# printed beside this CLI's own report and never changes the exit code.
# Env: TRUESTAMP_VERIFY_REMOTE
remote = false

# The environment a run checks (--environment) and keyless mode
# (--no-keyring) are options of the run only: no key in this file and no
# environment variable sets either. A supplied keyring file is given for
# the run with --keyring FILE.

# The Stellar and Bitcoin sources the verifier reads, each in place of the
# built-in one for the network its identity read shows it serves. Empty
# uses the built-in sources; regtest has none. A flag (--horizon,
# --esplora, --bitcoin-core) overrides the environment, which overrides
# this file. A URL here carries no user name or password.
# Env: TRUESTAMP_VERIFY_HORIZON
horizon = ""
# Env: TRUESTAMP_VERIFY_ESPLORA
esplora = ""
# A Bitcoin Core node's JSON-RPC URL, such as "http://127.0.0.1:8332".
# Env: TRUESTAMP_VERIFY_BITCOIN_CORE
bitcoin_core = ""

# A Bitcoin Core node's RPC credentials, sent to every Bitcoin Core node
# the verifier reads. They come from this file or the environment only,
# never from the command line, and nothing the CLI prints shows them.
# Env: TRUESTAMP_VERIFY_BITCOIN_CORE_USER
bitcoin_core_user = ""
# Env: TRUESTAMP_VERIFY_BITCOIN_CORE_PASSWORD
bitcoin_core_password = ""

# A keyring for each non-production environment, used only when a run's
# --environment names that environment (for example `truestamp verify
# --environment staging proof.json`). No environment variable sets them.
# [verify.keyrings]
# dev = "/path/to/dev-keyring.json"
# staging = "/path/to/staging-keyring.json"
# test = "/path/to/test-keyring.json"

# Several sources for one Stellar or Bitcoin network, in their order, with
# a source policy: "first" (the first source with a conclusive answer
# decides), "at_least N" (N of them must agree) or "all". Each source is a
# table with one key, horizon, esplora or bitcoin_core, whose value is its
# URL. A network with no such table has one source. Only this file sets
# them; no flag or environment variable does.
# [verify.sources.bitcoin.mainnet]
# policy = "at_least 2"
# sources = [
#   { esplora = "https://blockstream.info/api" },
#   { esplora = "https://mempool.space/api" },
# ]

[hash]
# Default algorithm for `truestamp hash`
# Env: TRUESTAMP_HASH_ALGORITHM
algorithm = "sha256"

# Default digest encoding: hex, base64, base64url
# Env: TRUESTAMP_HASH_ENCODING
encoding = "hex"

# Default output style: gnu (sha256sum-compatible), bsd, bare
# Env: TRUESTAMP_HASH_STYLE
style = "gnu"

[convert]
# Default IANA time zone for `truestamp convert time` and `convert id`
# (override with --to-zone). Accepts UTC, Local, or any IANA name.
# Env: TRUESTAMP_CONVERT_TIME_ZONE
time_zone = "UTC"

[logging]
# JSON log file path. Empty = platform default:
#   macOS:   ~/Library/Caches/truestamp/truestamp.log
#   Linux:   ~/.cache/truestamp/truestamp.log
#   Windows: %LOCALAPPDATA%\truestamp\truestamp.log
# Env: TRUESTAMP_LOGGING_FILE
file = ""

# Log level: debug, info, warn, error.
# Env: TRUESTAMP_LOGGING_LEVEL
level = "info"

# Rotate the log file once it reaches this many megabytes.
# Env: TRUESTAMP_LOGGING_MAX_SIZE_MB
max_size_mb = 10

# Retain this many rotated (compressed) backups.
# Env: TRUESTAMP_LOGGING_MAX_BACKUPS
max_backups = 5

# Delete rotated backups older than this many days.
# Env: TRUESTAMP_LOGGING_MAX_AGE_DAYS
max_age_days = 14
