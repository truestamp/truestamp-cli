name: Bug Report
description: Report a problem with the Truestamp CLI
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a report.

        If this is a suggestion rather than something broken, [the feedback board](https://truestamp.userjot.com/board/features) is the better home — ideas there are votable and show up on the [roadmap](https://truestamp.userjot.com/roadmap). Posting needs a UserJot account; the Feedback popup on [truestamp.com/support](https://www.truestamp.com/support) doesn't.

        **Please don't paste API keys, private keys, or claims data you consider sensitive.** `truestamp config show` masks the API key for you.

  - type: textarea
    id: version
    attributes:
      label: Version output
      description: The full output of `truestamp version`. It reports the version, install method, OS/arch and commit, so this one paste covers all of them.
      render: shell
      placeholder: |
        $ truestamp version
        truestamp
          version      0.14.0
          path         github.com/truestamp/truestamp-cli
          config path  /Users/you/.config/truestamp/config.toml
          install      homebrew
          go           go1.26.8 for darwin/arm64
          commit       eeb1270b
          built        2026-09-07T15:38:41Z
    validations:
      required: true

  - type: textarea
    id: command
    attributes:
      label: What you ran
      description: The exact `truestamp …` command. Redact anything sensitive.
      render: shell
      placeholder: truestamp verify --url https://example.com/proof.json
    validations:
      required: true

  - type: textarea
    id: happened
    attributes:
      label: What happened, and what you expected instead
      description: Include the full terminal output, or the exit code if there wasn't any. Adding `--json` often makes the output easier to read.
      render: shell
    validations:
      required: true

  - type: textarea
    id: more
    attributes:
      label: Anything else
      description: |
        Optional. Steps to reproduce, whether it's consistent or intermittent, an unusual network (proxy, firewall), or the ID of the item, proof, block, beacon or entropy record involved — a ULID or UUIDv7 lets us correlate with server-side logs.
