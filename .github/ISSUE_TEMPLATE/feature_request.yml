name: Feature Request
description: Suggest an idea for the Truestamp CLI
title: "[Feature] "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        This form is for the CLI itself — a flag, an output format, a sub-command, shell behaviour.

        For the Truestamp service (new chains, webhooks, the API, the web app), [the feedback board](https://truestamp.userjot.com/board/features) is the better home: ideas are votable and feed the [roadmap](https://truestamp.userjot.com/roadmap). Posting needs a UserJot account; the Feedback popup on [truestamp.com/support](https://www.truestamp.com/support) doesn't.

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to accomplish, and what goes wrong today?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What would you like `truestamp` to do? A sketch of the command line you'd want to type is ideal.
    validations:
      required: true

  - type: textarea
    id: more
    attributes:
      label: Anything else
      description: Optional. Alternatives you considered, or other context.
