# Same links as the default issue chooser in truestamp/.github, apart from the
# security URL, which points at this repository's private reporting form. Keep
# the two in step.

blank_issues_enabled: true
contact_links:
  - name: Question or discussion
    url: https://github.com/orgs/truestamp/discussions
    about: Ask questions and talk with the Truestamp team and community.

  - name: Feature idea or product feedback
    url: https://truestamp.userjot.com/board/features
    about: Suggest and vote on ideas, and see what's already been asked for. To post without a UserJot account, use the Feedback popup at truestamp.com/support.

  - name: Roadmap and release updates
    url: https://truestamp.userjot.com/roadmap
    about: What's planned, in progress, and recently shipped.

  - name: Security vulnerability
    url: https://github.com/truestamp/truestamp-cli/security/advisories/new
    about: Please report security issues privately, not as a public issue. See SECURITY.md.

  - name: Help using Truestamp
    url: https://www.truestamp.com/support
    about: Knowledge base, API docs, FAQ, and support@truestamp.com.
