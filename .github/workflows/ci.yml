name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Reusable — release.yml calls this workflow as a quality gate before
  # GoReleaser runs, so a failing lint/test/vuln check blocks a release
  # at the tagged SHA instead of producing a half-published state.
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install tools via mise
        uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
        with:
          experimental: true

      - name: Download modules
        run: go mod download

      - name: Lint install.sh
        run: shellcheck -s sh docs/install.sh docs/install.test.sh

      - name: Smoke-test install.sh
        run: sh docs/install.test.sh

      # Lint / vuln steps invoke the Taskfile tasks so CI and local dev share a
      # single source of truth: tool versions come from .tool-versions (mise
      # installed them above), and invocations/exclusions live in Taskfile.yml.
      # No `go install ...@latest` here — that shadowed the mise pins and made
      # CI break on unchanged code when a new tool release shipped a new rule.
      - name: gofmt
        run: task fmt-check

      - name: go vet
        run: task vet

      - name: staticcheck
        run: task staticcheck

      - name: gosec
        run: task gosec

      - name: govulncheck
        run: task vuln-check

      - name: Test
        # -race runs the full suite; seed-corpus fuzz targets replay as
        # regular tests inside this call, so `task fuzz` is covered
        # implicitly. Heavy `task fuzz-deep` stays local/manual.
        run: go test -race -coverprofile=coverage.out -covermode=atomic ./...

      - name: Test (chaos)
        # Reconnect-under-stress cases gated behind the `chaos` build tag
        # so they don't pad every plain `go test` run. They take ~10s due
        # to deliberate reconnect-backoff sleeps; we want them to fire on
        # every PR to catch regressions in the wschannel session loop.
        run: go test -tags=chaos -count=1 -race -timeout=120s ./internal/wschannel/...

      - name: Fuzz (codec)
        # Active mutation fuzzing — the seed corpus is already replayed
        # by the regular Test step above. 30s per target × 3 targets is
        # the upper bound on wall-clock impact. Linux only: macOS would
        # double runner-minutes for the same coverage signal.
        if: matrix.os == 'ubuntu-latest'
        run: |
          go test -run=^$ -fuzz=FuzzFrameUnmarshal -fuzztime=30s ./internal/wschannel/
          go test -run=^$ -fuzz=FuzzParseReply -fuzztime=30s ./internal/wschannel/
          go test -run=^$ -fuzz=FuzzRedactSecrets -fuzztime=30s ./internal/wschannel/

      - name: Build
        run: go build ./...

      - name: Upload coverage
        # Upload only from Linux to avoid two identical coverage artifacts.
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage
          path: coverage.out
          if-no-files-found: warn
