version: "3"

vars:
  BINARY: truestamp
  MODULE: github.com/truestamp/truestamp-cli

tasks:
  default:
    desc: List all available tasks
    cmds:
      - task --list-all

  # =============================================================================
  # Build
  # =============================================================================

  build:
    desc: Build the CLI binary for the current platform
    vars:
      VERSION:
        # Derive from the nearest git tag. `--dirty` flags uncommitted
        # changes, `--always` falls back to a short SHA if no tag exists.
        # Leading `v` is stripped so local builds match GoReleaser's
        # {{.Version}} format.
        sh: git describe --tags --always --dirty 2>/dev/null | sed 's/^v//' | tr -d '[:space:]' || echo dev
      GIT_COMMIT:
        sh: git rev-parse --short HEAD 2>/dev/null || echo unknown
      BUILD_DATE:
        sh: date -u +%Y-%m-%dT%H:%M:%SZ
      BUILD_YEAR:
        sh: date -u +%Y
      LDFLAGS: -s -w -X {{.MODULE}}/internal/version.Version={{.VERSION}} -X {{.MODULE}}/internal/version.GitCommit={{.GIT_COMMIT}} -X {{.MODULE}}/internal/version.BuildDate={{.BUILD_DATE}} -X {{.MODULE}}/internal/version.BuildYear={{.BUILD_YEAR}}
    cmds:
      - mkdir -p build
      - go build -ldflags "{{.LDFLAGS}}" -o build/{{.BINARY}} ./cmd/truestamp
    sources:
      - "**/*.go"
      # go:embed pulls non-Go files into the binary at compile time
      # (e.g. internal/config/defaults/config.toml). Track them here
      # so editing one invalidates the cache and forces a rebuild.
      - "internal/config/defaults/*.toml"
      # internal/specdata embeds the spec pins under verification/, which
      # task verification-sync replaces.
      - "internal/specdata/verification/**/*"
      - go.mod
      - go.sum
    generates:
      - "build/{{.BINARY}}"

  build-all:
    desc: Cross-compile for all supported platforms
    deps:
      - build
    vars:
      VERSION:
        sh: git describe --tags --always --dirty 2>/dev/null | sed 's/^v//' | tr -d '[:space:]' || echo dev
      GIT_COMMIT:
        sh: git rev-parse --short HEAD 2>/dev/null || echo unknown
      BUILD_DATE:
        sh: date -u +%Y-%m-%dT%H:%M:%SZ
      BUILD_YEAR:
        sh: date -u +%Y
      LDFLAGS: -s -w -X {{.MODULE}}/internal/version.Version={{.VERSION}} -X {{.MODULE}}/internal/version.GitCommit={{.GIT_COMMIT}} -X {{.MODULE}}/internal/version.BuildDate={{.BUILD_DATE}} -X {{.MODULE}}/internal/version.BuildYear={{.BUILD_YEAR}}
    cmds:
      - mkdir -p build
      - GOOS=darwin GOARCH=arm64 go build -ldflags "{{.LDFLAGS}}" -o build/{{.BINARY}}-{{.VERSION}}-darwin-arm64 ./cmd/truestamp
      - GOOS=darwin GOARCH=amd64 go build -ldflags "{{.LDFLAGS}}" -o build/{{.BINARY}}-{{.VERSION}}-darwin-amd64 ./cmd/truestamp
      - GOOS=linux GOARCH=amd64 go build -ldflags "{{.LDFLAGS}}" -o build/{{.BINARY}}-{{.VERSION}}-linux-amd64 ./cmd/truestamp
      - GOOS=linux GOARCH=arm64 go build -ldflags "{{.LDFLAGS}}" -o build/{{.BINARY}}-{{.VERSION}}-linux-arm64 ./cmd/truestamp
      - GOOS=windows GOARCH=amd64 go build -ldflags "{{.LDFLAGS}}" -o build/{{.BINARY}}-{{.VERSION}}-windows-amd64.exe ./cmd/truestamp
      - GOOS=windows GOARCH=arm64 go build -ldflags "{{.LDFLAGS}}" -o build/{{.BINARY}}-{{.VERSION}}-windows-arm64.exe ./cmd/truestamp
      - echo "Built v{{.VERSION}} binaries in build/"

  # =============================================================================
  # Run
  # =============================================================================

  run:
    desc: "Run verify without building (usage: task run -- proof.json [--offline] [--json])"
    cmds:
      - go run ./cmd/truestamp verify {{.CLI_ARGS}}

  upgrade-test-local:
    desc: "Build with a fake older version and exercise 'upgrade --check' against live GitHub releases"
    cmds:
      - |
        OLD_VERSION=0.0.1
        LDFLAGS="-X {{.MODULE}}/internal/version.Version=${OLD_VERSION}"
        mkdir -p build
        go build -ldflags "$LDFLAGS" -o build/truestamp-upgrade-test ./cmd/truestamp
        ./build/truestamp-upgrade-test upgrade --check --exit-code || EXIT=$?
        echo "upgrade --check --exit-code exit code: ${EXIT:-0}"
        if [ "${EXIT:-0}" != "1" ] && [ "${EXIT:-0}" != "0" ] && [ "${EXIT:-0}" != "3" ]; then
          echo "unexpected exit code"
          exit 1
        fi

  # =============================================================================
  # Docs preview (mirrors get.truestamp.com)
  # =============================================================================

  docs-serve:
    desc: "Serve docs/ locally with caddy (mirrors get.truestamp.com). Browse http://localhost:8080, test `curl http://localhost:8080/install.sh | sh` against the staged installer."
    cmds:
      - mise exec -- caddy file-server --listen :8080 --root docs

  # =============================================================================
  # Test & Quality
  # =============================================================================

  test:
    desc: Run all Go tests
    cmds:
      - go test ./...

  test-nonet:
    desc: "Run the whole suite (go test -count=1 ./...), or the command after --, with no network: macOS only, under the sandbox profile in tools/nonet/ with its own HOME, TMPDIR, GOCACHE and STATICCHECK_CACHE under NONET_WORK (default $TMPDIR), outside the tree. It refuses exactly every connection off loopback, loopback ports 4000 to 4003, 5432 and 4369, DNS, the Docker and Postgres Unix sockets and the keychain tool (/usr/bin/security). The recorder sees the command and every process it starts but those started through a SIP-protected binary such as /bin/sh, which are refused but not recorded. The control in tools/nonet/control/ runs first and must see every refusal. nonet exits 2 on a bad setup, 3 if the control fails, 4 if the command passes with a recorded network attempt, and otherwise with the command's status; Task reports any failure as exit 201, so read nonet's code from Task's \"exit status N\" line or run task -x test-nonet. The proof-bundle lane runs the CLI's tests, a reviewer's included, only under this guard or, where a sandbox would nest, the lane's copy of it. Example: task test-nonet -- go vet ./..."
    preconditions:
      - sh: test "$(uname -s)" = Darwin && command -v sandbox-exec >/dev/null && command -v clang >/dev/null
        msg: "test-nonet needs macOS's sandbox-exec and clang"
    cmds:
      - |
        work="${NONET_WORK:-${TMPDIR:-/tmp}}"
        work="${work%/}/truestamp-cli-nonet-$(printf %s "{{.ROOT_DIR}}" | shasum | cut -c1-8)"
        mkdir -p "$work"
        clang -dynamiclib -O2 -o "$work/netrec.dylib" tools/nonet/netrec.c
        NONET_WORK="$work" tools/nonet/nonet.sh {{if .CLI_ARGS}}{{.CLI_ARGS}}{{else}}go test -count=1 ./...{{end}}

  test-verbose:
    desc: Run all Go tests with verbose output
    cmds:
      - go test -v ./...

  test-chaos:
    desc: Run wschannel chaos tests under -race (no live server needed)
    cmds:
      - go test -tags=chaos -count=1 -race -timeout=120s ./internal/wschannel/...

  fuzz-codec:
    desc: Fuzz wschannel JSON codec and redactor (30s per target)
    cmds:
      - go test -run=^$ -fuzz=FuzzFrameUnmarshal -fuzztime=30s ./internal/wschannel/
      - go test -run=^$ -fuzz=FuzzParseReply -fuzztime=30s ./internal/wschannel/
      - go test -run=^$ -fuzz=FuzzRedactSecrets -fuzztime=30s ./internal/wschannel/

  test-coverage:
    desc: Run tests with coverage summary
    cmds:
      - go test -cover ./...

  test-coverage-report:
    desc: Generate HTML coverage report and open in browser
    cmds:
      - go test -coverprofile=coverage.out ./...
      - go tool cover -html=coverage.out -o coverage.html
      - open coverage.html
      - echo "Coverage report written to coverage.html"

  test-coverage-full:
    desc: "Accurate coverage including CLI integration tests' subprocess runs (Go 1.20+ instrumented binaries)"
    cmds:
      # Clean start. Two covdata sub-dirs: `bin` for the subprocess
      # binary's runtime data, `test` for go test's per-test-binary data.
      - rm -rf coverage && mkdir -p coverage/bin coverage/test coverage/merged
      # TRUESTAMP_COVERDIR is read by verify_test.go's TestMain to
      # (a) build the subprocess binary with -cover and (b) point its
      # GOCOVERDIR at coverage/bin. We don't use GOCOVERDIR directly
      # here because `go test -cover` overwrites GOCOVERDIR in the test
      # process's environment with its own temp dir.
      - TRUESTAMP_COVERDIR=$PWD/coverage/bin go test -cover -coverpkg=./... ./... -args -test.gocoverdir=$PWD/coverage/test >/dev/null
      # Merge the two covdata directories into a single textfmt profile.
      - go tool covdata merge -i=coverage/bin,coverage/test -o coverage/merged
      - go tool covdata textfmt -i=coverage/merged -o coverage.out
      - echo "--- per-function coverage (tail) ---"
      - go tool cover -func=coverage.out | tail -20
      - echo "--- per-package coverage ---"
      - |
        go tool cover -func=coverage.out | awk '
          /^total:/ { next }
          {
            split($1, a, ":")
            pkg = a[1]
            sub(/\/[^\/]+$/, "", pkg)
            pct = $NF
            gsub("%", "", pct)
            sum[pkg] += pct
            n[pkg]++
          }
          END {
            for (p in sum) printf "%-60s %6.2f%%\n", p, sum[p]/n[p]
          }
        ' | sort
      - echo "--- total ---"
      - 'go tool cover -func=coverage.out | grep ^total:'
      - go tool cover -html=coverage.out -o coverage.html
      - echo "HTML report written to coverage.html"

  vet:
    desc: Run go vet static analysis
    cmds:
      - go vet ./...

  staticcheck:
    desc: "Run staticcheck (pinned in .tool-versions, installed by `mise install`). CI runs this exact task, so the version can't drift from local."
    cmds:
      - staticcheck ./...

  gosec:
    desc: "Run the gosec security scanner (pinned in .tool-versions, installed by `mise install`). CI runs this exact task, so both the version AND the exclusion list below are single-sourced here — do not duplicate them in ci.yml."
    cmds:
      # gosec exclusions, justified:
      #   G104: unhandled lipgloss.Println / fmt.Fprintf to stdout — errors there
      #         are not actionable in a CLI.
      #   G115: four conversions, each within its target type: a ULID's
      #         millisecond time (48 bits) to int64 in convert id and in
      #         internal/tscrypto/ulid.go; a node position of the Bitcoin
      #         merkle-block parser (bounded by total_txs) to uint64; and
      #         the constant-time hex case fold of internal/tscrypto, whose
      #         int is one byte.
      #   G304: reading user-specified file paths IS the point of a CLI.
      #   G301/G302/G306: what the CLI writes for the user to read, a
      #         downloaded proof, a verify trace, an installed binary and
      #         their directories, takes the Unix defaults 0644/0755.
      #         config.toml, which can hold an API key and a Bitcoin Core
      #         node's RPC password, is created 0600 in a 0700 directory
      #         (config init), and SetAPIKey and SetTeam keep it 0600.
      #   G401/G501/G505: MD5 and SHA-1 are supported as legacy hash_type
      #         values (mirrors the Truestamp backend registry); runtime
      #         emits a stderr warning when either is used.
      #   G204: subprocess invocations (xattr, cosign) use hard-coded binary
      #         names resolved via PATH LookPath — no user-controlled command.
      # G704 (SSRF) is enabled: URLs are user- and operator-supplied by design
      # (the configured base URL, the verifier's --horizon, --esplora and
      # --bitcoin-core), so each site it reports is settled in the code with a
      # #nosec G704 that says why, and a new one fails the lint.
      - gosec -quiet -exclude-dir=testdata -exclude=G104,G115,G301,G302,G306,G304,G401,G501,G505,G204 ./...

  lint:
    desc: "All quality checks: vet + fmt-check + staticcheck + gosec. Every tool is pinned in .tool-versions (mise); CI runs these same tasks, so nothing drifts between local and CI."
    cmds:
      - task: vet
      - task: fmt-check
      - task: staticcheck
      - task: gosec

  vuln-check:
    desc: "Scan go.mod deps for known vulnerabilities. govulncheck is pinned in .tool-versions and installed by `mise install`; CI runs this exact task. The pin does not reduce coverage: govulncheck queries the live vuln.go.dev database at run time, so newly-published CVEs are still caught (a stale pin only misses analysis-engine improvements, never vulnerability data)."
    cmds:
      - govulncheck ./...

  test-race:
    desc: "Run all tests under the race detector (~2-20x slower; catches concurrent unsynchronized memory access)"
    cmds:
      - go test -race ./...

  bench:
    desc: "Run all benchmarks (BenchmarkXxx) with -benchmem for alloc accounting"
    cmds:
      - go test -run=^$ -bench=. -benchmem ./...

  bench-compare:
    desc: "Capture a baseline benchmark profile. Usage: task bench-compare -- baseline.txt (then later: go test -bench=. ... > new.txt && benchstat baseline.txt new.txt)"
    cmds:
      - |
        out="${1:-{{.CLI_ARGS | default "bench.out"}}}"
        go test -run=^$ -bench=. -benchmem -count=5 ./... | tee "$out"
        echo "Baseline written to $out. Compare later with: benchstat $out new.out"

  fuzz:
    desc: "Smoke-run every FuzzXxx with its seed corpus (no mutation, ~seconds)"
    cmds:
      - go test -run=^Fuzz ./...

  fuzz-deep:
    desc: "Actively fuzz every FuzzXxx for DURATION (default 15s) each. Use for manual hardening; very chatty. Failing targets are retried once to absorb the Go fuzz engine's known shutdown-boundary flake where an in-flight input reports 'context deadline exceeded' when fuzztime expires. A real bug writes a reproducer under the owning package's testdata/fuzz/FuzzXxx/ directory and reproduces on replay instantly. IMPORTANT: any files written under */testdata/fuzz/* must be committed — they are the permanent corpus that `task test` replays as regression tests. Run `find . -path '*/testdata/fuzz/*' -type f` after this task to list new reproducers, and `git add` (or `jj file track`) them before you commit."
    vars:
      DURATION: '{{.DURATION | default "15s"}}'
    cmds:
      - |
        set -e
        failed=0
        for pkg in $(go list ./...); do
          tests=$(go test -list='^Fuzz' "$pkg" 2>/dev/null | grep '^Fuzz' || true)
          for t in $tests; do
            echo "==> $pkg :: $t ({{.DURATION}})"
            if ! go test -run=^$ -fuzz="^${t}$" -fuzztime={{.DURATION}} "$pkg"; then
              echo "==> $pkg :: $t — first attempt failed; retrying once to rule out fuzz-engine shutdown flake"
              if ! go test -run=^$ -fuzz="^${t}$" -fuzztime={{.DURATION}} "$pkg"; then
                failed=$((failed+1))
              fi
            fi
          done
        done
        if [ $failed -gt 0 ]; then
          echo "FAILED: $failed fuzz target(s) discovered issues; see testdata/fuzz/ for reproducers"
          exit 1
        fi

  fuzz-list:
    desc: "List every FuzzXxx target across the repo"
    cmds:
      - |
        for pkg in $(go list ./...); do
          tests=$(go test -list='^Fuzz' "$pkg" 2>/dev/null | grep '^Fuzz' || true)
          if [ -n "$tests" ]; then
            echo "$pkg"
            echo "$tests" | sed 's/^/  /'
          fi
        done

  fmt:
    desc: Format all Go source files
    cmds:
      - gofmt -w .

  fmt-check:
    desc: Check formatting without modifying files
    cmds:
      - test -z "$(gofmt -l .)" || (echo "Files need formatting:" && gofmt -l . && exit 1)

  precommit:
    desc: "Fast pre-commit checks (fmt + lint + vuln-check + test + build). Target <10s on a hot cache. Note: 'task test' already replays every FuzzXxx seed corpus as part of the regular test suite, so no separate fuzz step is needed here."
    cmds:
      - task: fmt
      - task: lint
      - task: vuln-check
      - task: test
      - task: build

  precommit-full:
    desc: "Strict pre-release bundle: precommit + race detector + fuzz seed-corpus replay + vuln scan + all-platform build. Takes ~3-5 min."
    cmds:
      - task: fmt
      - task: lint
      - task: test-race
      - task: fuzz
      - task: vuln-check
      - task: build-all

  # =============================================================================
  # Proof specification (truestamp-verification)
  # =============================================================================

  # Copies the proof specification into the CLI from one commit of the spec
  # repository. testdata/verification/ gets spec/, vectors/ and
  # MANIFEST.sha256; internal/specdata/verification/ gets spec/ alone, the
  # runtime pins, which internal/specdata embeds with go:embed (go:embed
  # reaches only its own package's directory, never testdata/). Each gets
  # SOURCE, one line holding the full id of the commit and a newline.
  # internal/specdata's tests hold both copies to that manifest and to each
  # other, so a failure there is fixed by syncing again, never by editing a
  # copied file. A change to the spec is made and committed in
  # truestamp-verification, and reaches the CLI only through this sync.
  #
  # Only a commit on the spec's main is taken. jj records every working-copy
  # snapshot as a git commit on no branch, so a SOURCE naming one would name
  # work that may never be published and that jj may later discard.
  # SPEC_ALLOW_OFF_MAIN=1 takes another commit on purpose, with a warning.
  #
  # verification-check re-reads the commit SOURCE names from the spec repo and
  # compares both copies with it, which the manifest test cannot do: an edit
  # made together with its manifest line passes that test. Run it by hand
  # before landing a sync. It stays out of CI, which has no copy of the spec
  # repository to read.
  #
  # Both read the spec repo with read-only git (rev-parse, merge-base,
  # cat-file, archive) and take their inputs from the environment or as task
  # variables. The default SPEC_REPO is relative to this Taskfile, so from a
  # worktree pass an absolute SPEC_REPO.
  #
  #   task verification-sync                               # ../truestamp-verification at the head of its main branch
  #   task verification-sync SPEC_REV=<commit or ref> SPEC_REPO=<absolute path>
  #   task verification-check [SPEC_REPO=<absolute path>]
  verification-sync:
    desc: "Copy the proof spec at one commit on its main into testdata/verification/ and internal/specdata/verification/ (SPEC_REPO=../truestamp-verification, SPEC_REV=refs/heads/main, the main branch, never a tag of that name; from a worktree SPEC_REPO must be absolute; SPEC_ALLOW_OFF_MAIN=1 takes a commit not on main)."
    silent: true
    env:
      SPEC_REPO: '{{.SPEC_REPO | default "../truestamp-verification"}}'
      SPEC_REV: '{{.SPEC_REV | default "refs/heads/main"}}'
      SPEC_ALLOW_OFF_MAIN: '{{.SPEC_ALLOW_OFF_MAIN}}'
    cmds:
      - |
        set -euo pipefail

        fixtures="testdata/verification"
        pins="internal/specdata/verification"
        commit=""
        stage=""
        reported=""
        # Set by the swap below while the fixtures hold the new commit and the
        # pins do not yet.
        mixed=""

        # Every failure ends in one ERROR line: fail's own, or, for a step
        # that fails without one, the line the EXIT trap adds.
        fail() {
          echo "ERROR: $*" >&2
          reported=1
          exit 1
        }
        exists() { [ -e "$1" ] || [ -L "$1" ]; }
        # The name beside a target that the swap below uses, such as
        # testdata/.verification.new.
        beside() { echo "$(dirname "$1")/.$(basename "$1").$2"; }
        cleanup() {
          exit_code=$?
          if [ -n "$stage" ]; then rm -rf "$stage"; fi
          rm -rf "$(beside "$fixtures" new)" "$(beside "$pins" new)"
          if [ "$exit_code" -ne 0 ] && [ -z "$reported" ]; then
            echo "ERROR: the sync of ${commit:-$SPEC_REV} stopped at the failure above.$mixed" >&2
          fi
        }
        trap cleanup EXIT

        # This shell's cd takes a lone "-" as the previous directory and has
        # no "--", so a value beginning with "-" is refused, not guessed at.
        case "$SPEC_REPO" in
          -*) fail "SPEC_REPO $SPEC_REPO begins with '-'. Pass it as ./$SPEC_REPO or as an absolute path." ;;
        esac
        if ! repo="$(cd "$SPEC_REPO" 2>/dev/null && pwd -P)"; then
          fail "SPEC_REPO $SPEC_REPO is not a directory from $PWD. From a worktree, pass an absolute SPEC_REPO."
        fi

        # SOURCE records the full id, never the ref it was named by, since a
        # branch moves. The default names the branch in full: a bare "main"
        # would resolve to a tag named main before the branch.
        if ! commit="$(git -C "$repo" rev-parse --verify --quiet "$SPEC_REV^{commit}")"; then
          fail "no commit $SPEC_REV in $repo. Set SPEC_REPO and SPEC_REV."
        fi

        on_main=0
        git -C "$repo" merge-base --is-ancestor "$commit" refs/heads/main || on_main=$?
        case "$on_main" in
          0) ;;
          1)
            if [ "$SPEC_ALLOW_OFF_MAIN" = "1" ]; then
              echo "WARNING: SPEC_ALLOW_OFF_MAIN=1: syncing $commit, which is not on main in $repo." >&2
            else
              fail "$commit is not on main in $repo. Sync a commit on main, or set SPEC_ALLOW_OFF_MAIN=1 to take it on purpose."
            fi
            ;;
          *) fail "could not tell whether $commit is on main in $repo." ;;
        esac

        stage="$(mktemp -d)"
        mkdir "$stage/fixtures" "$stage/pins"
        staged="$stage/fixtures"

        # From the commit itself, never the spec's working copy, so an
        # uncommitted edit there cannot reach the CLI.
        if ! git -C "$repo" archive --format=tar "$commit" spec vectors MANIFEST.sha256 \
          | tar -x -f - -C "$staged"; then
          fail "could not take spec/, vectors/ and MANIFEST.sha256 from $commit."
        fi

        # Refuse a copy that is not exactly what its manifest lists: a link
        # anywhere, including the top level, a manifest the manifest test
        # rejects, a file the manifest leaves out, a manifest out of order or
        # with a path twice, or a byte that differs (a stale manifest, or a
        # line-end conversion or filter on the way out of git).
        if [ ! -d "$staged/spec" ] || [ ! -d "$staged/vectors" ] || [ ! -f "$staged/MANIFEST.sha256" ] \
          || [ -n "$(cd "$staged" && find spec vectors MANIFEST.sha256 ! -type f ! -type d)" ]; then
          fail "$commit has a link or a missing entry among spec/, vectors/ and MANIFEST.sha256."
        fi
        # The manifest test's grammar (manifestLine in
        # internal/specdata/manifest_test.go): each line a digest, two spaces
        # and a path under spec/ or vectors/ with no segment beginning with a
        # dot, so no nested .gitattributes or other dotfile, and a final
        # newline.
        if [ "$(tail -c 1 "$staged/MANIFEST.sha256" | od -An -tx1 | tr -d ' \n')" != "0a" ]; then
          fail "MANIFEST.sha256 at $commit does not end in a newline."
        fi
        found=0
        bad="$(LC_ALL=C grep -a -n -m 1 -E -v '^[0-9a-f]{64}  (spec|vectors)(/[A-Za-z0-9_-][A-Za-z0-9._-]*)+$' \
          "$staged/MANIFEST.sha256")" || found=$?
        case "$found" in
          0) fail "MANIFEST.sha256 at $commit line ${bad%%:*} is not a lowercase SHA-256, two spaces and a path under spec/ or vectors/ made of letters, digits, '.', '_' and '-', with no segment beginning with a dot." ;;
          1) ;;
          *) fail "could not read MANIFEST.sha256 at $commit." ;;
        esac
        listed="$(sed 's/^[0-9a-f]\{64\}  //' "$staged/MANIFEST.sha256")"
        if [ "$listed" != "$(printf '%s\n' "$listed" | LC_ALL=C sort -u)" ]; then
          fail "MANIFEST.sha256 at $commit is not sorted by path, or lists a path twice."
        fi
        # Nor a name that gofmt or Go's module rules act on. gofmt -w . (task
        # fmt) rewrites every .go file under the tree, testdata/ included.
        # go install builds the CLI from Go's module zip of this repository,
        # testdata/ included, and that zip is refused for a path that
        # module.CheckFilePath rejects (within the grammar above, a segment
        # ending in a dot, or one whose part before its first dot is a name
        # Windows reserves: aux, con, nul, prn, com1 to com9 or lpt1 to lpt9,
        # in any case) and for two paths that differ only in case. It leaves
        # out the files of a vendor folder. A nested go.mod, its name in any
        # case, makes the module zip drop its folder; go:embed skips that
        # folder silently when the name is exactly go.mod, or on a disk that
        # ignores case. The manifest's paths are checked, before the file
        # list is, so two names a case-insensitive disk holds as one file are
        # named.
        found=0
        bad="$(printf '%s\n' "$listed" | LC_ALL=C awk '
          BEGIN {
            n = split("con prn aux nul com1 com2 com3 com4 com5 com6 com7 com8 com9 lpt1 lpt2 lpt3 lpt4 lpt5 lpt6 lpt7 lpt8 lpt9", r, " ")
            for (i = 1; i <= n; i++) reserved[r[i]] = 1
          }
          {
            if ($0 ~ /\.go$/) { print "gofmt " $0; exit }
            k = split($0, seg, "/")
            for (i = 1; i <= k; i++) {
              s = seg[i]
              stem = tolower(s)
              sub(/\..*$/, "", stem)
              if (s ~ /\.$/) { print "module " $0 " its segment " s " ends in a dot, which module.CheckFilePath refuses"; exit }
              if (stem in reserved) { print "module " $0 " its segment " s " begins with " stem ", a name Windows reserves, which module.CheckFilePath refuses"; exit }
              if (tolower(s) == "go.mod") { print "module " $0 " its segment " s " is a nested go.mod, which makes the module zip drop its folder and can make go:embed skip it silently"; exit }
              if (s == "vendor") { print "module " $0 " it is under a vendor folder, whose files the module zip leaves out"; exit }
            }
            p = $0
            while (p != "") {
              f = tolower(p)
              if ((f in seen) && seen[f] != p) { print "module " p " it and " seen[f] " differ only in case, which the module zip refuses"; exit }
              seen[f] = p
              if (index(p, "/") == 0) break
              sub(/\/[^\/]*$/, "", p)
            }
          }')" || found=$?
        if [ "$found" -ne 0 ]; then
          fail "could not check the paths MANIFEST.sha256 at $commit lists."
        fi
        case "$bad" in
          "") ;;
          gofmt\ *) fail "$commit holds ${bad#gofmt }, a .go file: gofmt -w . (task fmt) would rewrite it." ;;
          *)
            bad="${bad#module }"
            fail "$commit holds ${bad%% *}: ${bad#* }. go install builds the CLI from Go's module zip of this repository, testdata/ included, so that name would stop the install or change what it ships."
            ;;
        esac
        if [ "$listed" != "$(cd "$staged" && find spec vectors -type f | LC_ALL=C sort)" ]; then
          fail "MANIFEST.sha256 at $commit does not list exactly the files under spec/ and vectors/."
        fi
        if ! (cd "$staged" && shasum -a 256 --check --quiet --strict MANIFEST.sha256); then
          fail "a file at $commit does not match its line in MANIFEST.sha256."
        fi

        printf '%s\n' "$commit" > "$staged/SOURCE"
        cp -R "$staged/spec" "$stage/pins/spec"
        cp "$staged/SOURCE" "$stage/pins/SOURCE"

        # Each copy is replaced whole, so a file deleted in the spec leaves the
        # CLI too. Both new copies are first placed beside their targets, so a
        # failed copy changes nothing. Each is then swapped in by renames within
        # its own directory, and its old copy is removed only once the new one
        # is in place, so a failure leaves every target holding its old copy or
        # its new one, never neither.
        mkdir -p "$(dirname "$fixtures")" "$(dirname "$pins")"
        for target in "$fixtures" "$pins"; do
          old="$(beside "$target" old)"
          if exists "$old" && ! exists "$target"; then
            fail "$old holds the only copy of $target, left by an interrupted sync. Move it back to $target, then sync $commit again."
          fi
          rm -rf "$old" "$(beside "$target" new)"
        done
        if ! cp -R "$stage/fixtures" "$(beside "$fixtures" new)" \
          || ! cp -R "$stage/pins" "$(beside "$pins" new)"; then
          fail "could not place $commit beside $fixtures and $pins; neither was changed."
        fi
        # A failure once the fixtures are swapped also says that they already
        # hold the new commit.
        for target in "$fixtures" "$pins"; do
          new="$(beside "$target" new)"
          old="$(beside "$target" old)"
          if exists "$target"; then
            mv "$target" "$old" || fail "could not move $target aside to sync $commit; it is unchanged.$mixed"
          fi
          if ! mv "$new" "$target"; then
            if exists "$old" && ! mv "$old" "$target"; then
              fail "could not move $commit into $target, nor its previous copy back; that copy is in $old.$mixed"
            fi
            fail "could not move $commit into $target; its previous copy is back in place.$mixed"
          fi
          if [ "$target" = "$fixtures" ]; then
            mixed=" $fixtures already holds $commit, so the two copies disagree until a re-sync."
          else
            mixed=""
          fi
          rm -rf "$old"
        done
        echo "Synced truestamp-verification $commit into $fixtures and $pins."

  verification-check:
    desc: "Compare testdata/verification/ and internal/specdata/verification/ with the spec commit their SOURCE names, read again from SPEC_REPO (default ../truestamp-verification; from a worktree it must be absolute). By hand before landing a sync; not in CI."
    silent: true
    env:
      SPEC_REPO: '{{.SPEC_REPO | default "../truestamp-verification"}}'
      SPEC_ALLOW_OFF_MAIN: '{{.SPEC_ALLOW_OFF_MAIN}}'
    cmds:
      - |
        set -euo pipefail

        fixtures="testdata/verification"
        pins="internal/specdata/verification"
        commit=""
        stage=""
        reported=""

        fail() {
          echo "ERROR: $*" >&2
          reported=1
          exit 1
        }
        cleanup() {
          exit_code=$?
          if [ -n "$stage" ]; then rm -rf "$stage"; fi
          if [ "$exit_code" -ne 0 ] && [ -z "$reported" ]; then
            echo "ERROR: the check of ${commit:-the copies} stopped at the failure above." >&2
          fi
        }
        trap cleanup EXIT

        # As in verification-sync: this cd has no "--" and takes "-" itself.
        case "$SPEC_REPO" in
          -*) fail "SPEC_REPO $SPEC_REPO begins with '-'. Pass it as ./$SPEC_REPO or as an absolute path." ;;
        esac
        if ! repo="$(cd "$SPEC_REPO" 2>/dev/null && pwd -P)"; then
          fail "SPEC_REPO $SPEC_REPO is not a directory from $PWD. From a worktree, pass an absolute SPEC_REPO."
        fi

        # SOURCE is one line, a 40-hex commit id and a newline, the same in both.
        commit="$(head -c 40 "$fixtures/SOURCE" 2>/dev/null || true)"
        case "$commit" in
          *[!0-9a-f]*) commit="" ;;
        esac
        if [ "${#commit}" -ne 40 ] || ! printf '%s\n' "$commit" | cmp -s - "$fixtures/SOURCE" \
          || ! cmp -s "$fixtures/SOURCE" "$pins/SOURCE"; then
          fail "$fixtures/SOURCE and $pins/SOURCE do not hold the same one line, a 40-hex commit id and a newline. Run task verification-sync."
        fi

        if ! git -C "$repo" cat-file -e "$commit^{commit}" 2>/dev/null; then
          fail "SOURCE names $commit, which $repo does not hold."
        fi

        on_main=0
        git -C "$repo" merge-base --is-ancestor "$commit" refs/heads/main || on_main=$?
        case "$on_main" in
          0) ;;
          1)
            if [ "$SPEC_ALLOW_OFF_MAIN" = "1" ]; then
              echo "WARNING: SPEC_ALLOW_OFF_MAIN=1: checking $commit, which is not on main in $repo." >&2
            else
              fail "SOURCE names $commit, which is not on main in $repo."
            fi
            ;;
          *) fail "could not tell whether $commit is on main in $repo." ;;
        esac

        # The trees the sync would write from that commit, SOURCE included, so
        # the comparison below is exact.
        stage="$(mktemp -d)"
        mkdir "$stage/fixtures" "$stage/pins"
        if ! git -C "$repo" archive --format=tar "$commit" spec vectors MANIFEST.sha256 \
          | tar -x -f - -C "$stage/fixtures"; then
          fail "could not take spec/, vectors/ and MANIFEST.sha256 from $commit."
        fi

        # The manifest grammar verification-sync enforces, which is the
        # manifest test's: a copy that matches the commit exactly still fails
        # that test if its manifest does.
        if [ ! -f "$stage/fixtures/MANIFEST.sha256" ] \
          || [ "$(tail -c 1 "$stage/fixtures/MANIFEST.sha256" | od -An -tx1 | tr -d ' \n')" != "0a" ]; then
          fail "MANIFEST.sha256 at $commit is not a file that ends in a newline."
        fi
        found=0
        bad="$(LC_ALL=C grep -a -n -m 1 -E -v '^[0-9a-f]{64}  (spec|vectors)(/[A-Za-z0-9_-][A-Za-z0-9._-]*)+$' \
          "$stage/fixtures/MANIFEST.sha256")" || found=$?
        case "$found" in
          0) fail "MANIFEST.sha256 at $commit line ${bad%%:*} is not a lowercase SHA-256, two spaces and a path under spec/ or vectors/ made of letters, digits, '.', '_' and '-', with no segment beginning with a dot." ;;
          1) ;;
          *) fail "could not read MANIFEST.sha256 at $commit." ;;
        esac

        printf '%s\n' "$commit" > "$stage/fixtures/SOURCE"
        cp -R "$stage/fixtures/spec" "$stage/pins/spec"
        cp "$stage/fixtures/SOURCE" "$stage/pins/SOURCE"

        # diff follows links, so they are refused first.
        links="$(find "$fixtures" "$pins" ! -type f ! -type d)"
        if [ -n "$links" ]; then
          printf '%s\n' "$links" >&2
          fail "the copies of $commit hold a link or another entry that is not a file or a directory."
        fi
        differs=0
        diff -rq "$stage/fixtures" "$fixtures" || differs=1
        diff -rq "$stage/pins" "$pins" || differs=1
        if [ "$differs" -ne 0 ]; then
          fail "the copies differ from $commit, which their SOURCE names. Run task verification-sync to replace them."
        fi
        echo "$fixtures and $pins match truestamp-verification $commit."

  # Copies the Merkle library's known answers, vectors/merkle.json of
  # truestamp-merkle-ex, into testdata/merkle/ from one commit, with
  # SOURCE, one line holding the full id of the commit and a newline.
  # internal/registry's walk tests read the copy, and its copy test holds
  # the file to the SHA-256 of the file at the commit SOURCE names, so a sync
  # of another commit changes that test too. The default commit is the one
  # the spec's reference verifier pins in its elixir/mix.lock, so the known
  # answers are those of the library the reference walks with.
  #
  # As for the spec, only a commit on the library's main is taken, unless
  # MERKLE_ALLOW_OFF_MAIN=1. The file is read from the commit, never from the
  # library's working copy, with read-only git (rev-parse, merge-base,
  # ls-tree, cat-file); one that is not a regular file is refused, and its
  # bytes are copied as git holds them, with no filter or line-end
  # conversion. The copy is swapped in by renames within testdata/, so a
  # failure leaves the old copy or the new one, never neither.
  #
  # merkle-vectors-check re-reads vectors/merkle.json at the commit SOURCE
  # names and compares the copy with it, which the copy test cannot do: an
  # edit of the file made together with the test's digest passes that test.
  # It reads with the same read-only git and writes nothing in the tree.
  # Run it by hand before landing a sync. It stays out of CI, which has no
  # copy of the library to read.
  #
  #   task merkle-vectors-sync                         # ../truestamp-merkle-ex at the commit the spec pins
  #   task merkle-vectors-sync MERKLE_REV=<commit> MERKLE_REPO=<absolute path>
  #   task merkle-vectors-check [MERKLE_REPO=<absolute path>]
  merkle-vectors-sync:
    desc: "Copy vectors/merkle.json of truestamp-merkle-ex at one commit on its main into testdata/merkle/ with SOURCE (MERKLE_REPO=../truestamp-merkle-ex, MERKLE_REV=0862f3e96f670ef605bdfa4077c96039040e585f, the commit the spec's elixir/mix.lock pins; from a worktree MERKLE_REPO must be absolute; MERKLE_ALLOW_OFF_MAIN=1 takes a commit not on main)."
    silent: true
    env:
      MERKLE_REPO: '{{.MERKLE_REPO | default "../truestamp-merkle-ex"}}'
      MERKLE_REV: '{{.MERKLE_REV | default "0862f3e96f670ef605bdfa4077c96039040e585f"}}'
      MERKLE_ALLOW_OFF_MAIN: '{{.MERKLE_ALLOW_OFF_MAIN}}'
    cmds:
      - |
        set -euo pipefail

        target="testdata/merkle"
        commit=""
        stage=""
        reported=""

        fail() {
          echo "ERROR: $*" >&2
          reported=1
          exit 1
        }
        exists() { [ -e "$1" ] || [ -L "$1" ]; }
        # The name beside the target that the swap below uses, such as
        # testdata/.merkle.new.
        beside() { echo "$(dirname "$1")/.$(basename "$1").$2"; }
        cleanup() {
          exit_code=$?
          if [ -n "$stage" ]; then rm -rf "$stage"; fi
          rm -rf "$(beside "$target" new)"
          if [ "$exit_code" -ne 0 ] && [ -z "$reported" ]; then
            echo "ERROR: the sync of ${commit:-$MERKLE_REV} stopped at the failure above." >&2
          fi
        }
        trap cleanup EXIT

        # This shell's cd takes a lone "-" as the previous directory and has
        # no "--", so a value beginning with "-" is refused, not guessed at.
        case "$MERKLE_REPO" in
          -*) fail "MERKLE_REPO $MERKLE_REPO begins with '-'. Pass it as ./$MERKLE_REPO or as an absolute path." ;;
        esac
        if ! repo="$(cd "$MERKLE_REPO" 2>/dev/null && pwd -P)"; then
          fail "MERKLE_REPO $MERKLE_REPO is not a directory from $PWD. From a worktree, pass an absolute MERKLE_REPO."
        fi

        # SOURCE records the full id, never the name it was given by.
        if ! commit="$(git -C "$repo" rev-parse --verify --quiet "$MERKLE_REV^{commit}")"; then
          fail "no commit $MERKLE_REV in $repo. Set MERKLE_REPO and MERKLE_REV."
        fi

        on_main=0
        git -C "$repo" merge-base --is-ancestor "$commit" refs/heads/main || on_main=$?
        case "$on_main" in
          0) ;;
          1)
            if [ "$MERKLE_ALLOW_OFF_MAIN" = "1" ]; then
              echo "WARNING: MERKLE_ALLOW_OFF_MAIN=1: syncing $commit, which is not on main in $repo." >&2
            else
              fail "$commit is not on main in $repo. Sync a commit on main, or set MERKLE_ALLOW_OFF_MAIN=1 to take it on purpose."
            fi
            ;;
          *) fail "could not tell whether $commit is on main in $repo." ;;
        esac

        # A regular file in the commit's tree: not a link, a submodule or a
        # folder, and absent if any folder above it is a link.
        if ! entry="$(git -C "$repo" ls-tree "$commit" -- vectors/merkle.json)"; then
          fail "could not read the tree of $commit."
        fi
        tab="$(printf '\t')"
        case "$entry" in
          "100644 blob "*"${tab}vectors/merkle.json") ;;
          "") fail "$commit has no vectors/merkle.json." ;;
          *) fail "vectors/merkle.json at $commit is not a regular file: $entry" ;;
        esac

        stage="$(mktemp -d)"
        mkdir "$stage/merkle"
        if ! git -C "$repo" cat-file blob "$commit:vectors/merkle.json" > "$stage/merkle/merkle.json"; then
          fail "could not read vectors/merkle.json at $commit."
        fi
        if [ ! -s "$stage/merkle/merkle.json" ]; then
          fail "vectors/merkle.json at $commit is empty."
        fi
        printf '%s\n' "$commit" > "$stage/merkle/SOURCE"

        old="$(beside "$target" old)"
        new="$(beside "$target" new)"
        if exists "$old" && ! exists "$target"; then
          fail "$old holds the only copy of $target, left by an interrupted sync. Move it back to $target, then sync $commit again."
        fi
        rm -rf "$old" "$new"
        mkdir -p "$(dirname "$target")"
        if ! cp -R "$stage/merkle" "$new"; then
          fail "could not place $commit beside $target; it was not changed."
        fi
        if exists "$target"; then
          mv "$target" "$old" || fail "could not move $target aside to sync $commit; it is unchanged."
        fi
        if ! mv "$new" "$target"; then
          if exists "$old" && ! mv "$old" "$target"; then
            fail "could not move $commit into $target, nor its previous copy back; that copy is in $old."
          fi
          fail "could not move $commit into $target; its previous copy is back in place."
        fi
        rm -rf "$old"
        echo "Synced vectors/merkle.json of truestamp-merkle-ex $commit into $target."

  merkle-vectors-check:
    desc: "Compare testdata/merkle/ with vectors/merkle.json at the commit its SOURCE names, read again from MERKLE_REPO (default ../truestamp-merkle-ex; from a worktree it must be absolute; MERKLE_ALLOW_OFF_MAIN=1 checks a commit not on main). By hand before landing a sync; not in CI."
    silent: true
    env:
      MERKLE_REPO: '{{.MERKLE_REPO | default "../truestamp-merkle-ex"}}'
      MERKLE_ALLOW_OFF_MAIN: '{{.MERKLE_ALLOW_OFF_MAIN}}'
    cmds:
      - |
        set -euo pipefail

        target="testdata/merkle"
        commit=""
        stage=""
        reported=""

        fail() {
          echo "ERROR: $*" >&2
          reported=1
          exit 1
        }
        cleanup() {
          exit_code=$?
          if [ -n "$stage" ]; then rm -rf "$stage"; fi
          if [ "$exit_code" -ne 0 ] && [ -z "$reported" ]; then
            echo "ERROR: the check of ${commit:-$target} stopped at the failure above." >&2
          fi
        }
        trap cleanup EXIT

        # As in merkle-vectors-sync: this cd has no "--" and takes "-" itself.
        case "$MERKLE_REPO" in
          -*) fail "MERKLE_REPO $MERKLE_REPO begins with '-'. Pass it as ./$MERKLE_REPO or as an absolute path." ;;
        esac
        if ! repo="$(cd "$MERKLE_REPO" 2>/dev/null && pwd -P)"; then
          fail "MERKLE_REPO $MERKLE_REPO is not a directory from $PWD. From a worktree, pass an absolute MERKLE_REPO."
        fi

        # SOURCE is one line, a 40-hex commit id and a newline.
        commit="$(head -c 40 "$target/SOURCE" 2>/dev/null || true)"
        case "$commit" in
          *[!0-9a-f]*) commit="" ;;
        esac
        if [ "${#commit}" -ne 40 ] || ! printf '%s\n' "$commit" | cmp -s - "$target/SOURCE"; then
          commit=""
          fail "$target/SOURCE does not hold one line, a 40-hex commit id and a newline. Run task merkle-vectors-sync."
        fi

        # The id must be a commit's own full id: rev-parse peels the id of an
        # annotated tag to its commit, and SOURCE never names a tag.
        if ! resolved="$(git -C "$repo" rev-parse --verify --quiet "$commit^{commit}")" \
          || [ "$resolved" != "$commit" ]; then
          fail "SOURCE names $commit, which is not a commit $repo holds."
        fi

        on_main=0
        git -C "$repo" merge-base --is-ancestor "$commit" refs/heads/main || on_main=$?
        case "$on_main" in
          0) ;;
          1)
            if [ "$MERKLE_ALLOW_OFF_MAIN" = "1" ]; then
              echo "WARNING: MERKLE_ALLOW_OFF_MAIN=1: checking $commit, which is not on main in $repo." >&2
            else
              fail "SOURCE names $commit, which is not on main in $repo."
            fi
            ;;
          *) fail "could not tell whether $commit is on main in $repo." ;;
        esac

        # The tree the sync would write from that commit, SOURCE included, so
        # the comparison below is exact.
        if ! entry="$(git -C "$repo" ls-tree "$commit" -- vectors/merkle.json)"; then
          fail "could not read the tree of $commit."
        fi
        tab="$(printf '\t')"
        case "$entry" in
          "100644 blob "*"${tab}vectors/merkle.json") ;;
          "") fail "$commit has no vectors/merkle.json." ;;
          *) fail "vectors/merkle.json at $commit is not a regular file: $entry" ;;
        esac
        stage="$(mktemp -d)"
        mkdir "$stage/merkle"
        if ! git -C "$repo" cat-file blob "$commit:vectors/merkle.json" > "$stage/merkle/merkle.json"; then
          fail "could not read vectors/merkle.json at $commit."
        fi
        if [ ! -s "$stage/merkle/merkle.json" ]; then
          fail "vectors/merkle.json at $commit is empty."
        fi
        printf '%s\n' "$commit" > "$stage/merkle/SOURCE"

        # diff follows links, so they are refused first.
        if [ -L "$target" ] || [ ! -d "$target" ]; then
          fail "$target is not a directory."
        fi
        links="$(find "$target" ! -type f ! -type d)"
        if [ -n "$links" ]; then
          printf '%s\n' "$links" >&2
          fail "$target holds a link or another entry that is not a file or a directory."
        fi
        if ! diff -rq "$stage/merkle" "$target"; then
          fail "$target differs from vectors/merkle.json at $commit, which its SOURCE names. Run task merkle-vectors-sync to replace it."
        fi
        echo "$target matches vectors/merkle.json of truestamp-merkle-ex $commit."

  # =============================================================================
  # Release (GoReleaser)
  # =============================================================================

  release-check:
    desc: Validate .goreleaser.yaml syntax and configuration
    cmds:
      - mise exec -- goreleaser check

  release-snapshot:
    desc: "Local snapshot release into dist/ — skips cosign signing (keyless requires the CI OIDC token) and GitHub publishing, so this runs fully offline and is safe for pre-release inspection."
    cmds:
      - mise exec -- goreleaser release --snapshot --clean --skip=sign,publish
      - 'echo "✅ Snapshot artifacts in dist/"'

  # =============================================================================
  # Dependencies
  # =============================================================================

  deps:
    desc: Download and tidy module dependencies
    cmds:
      - go mod tidy
      - go mod download

  deps-update:
    desc: Update all dependencies to latest versions
    cmds:
      - go get -u ./...
      - go mod tidy

  # =============================================================================
  # Cleanup
  # =============================================================================

  clean:
    desc: Remove build directory and artifacts
    cmds:
      - rm -rf build/
      - echo "Cleaned build artifacts"
